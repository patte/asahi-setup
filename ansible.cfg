[defaults]
inventory           = inventory.ini
roles_path          = roles
# The old community.general.yaml callback was removed in community.general 12.
# Same output, via the core default callback.
stdout_callback     = default
result_format       = yaml
display_skipped_hosts = false
interpreter_python  = auto_silent
retry_files_enabled = false
nocows              = 1

[privilege_escalation]
become_method = sudo
