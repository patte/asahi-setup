[defaults]
inventory           = inventory.ini
roles_path          = roles
# The old community.general.yaml callback was removed in community.general 12.
# Same output, via the core default callback.
stdout_callback     = default
result_format       = yaml
display_skipped_hosts = false
interpreter_python  = auto_silent
retry_files_enabled = false
nocows              = 1

# Gathering facts is the bulk of a short run — a couple of seconds to learn the
# one fact a role actually reads. Cache it; `smart` then skips the gather task
# outright while the cache is warm, so ./hypr.sh goes 2.6s -> 1.0s and every
# ./run.sh saves the same.
#
# The cache lives under XDG_RUNTIME_DIR, which is tmpfs and is emptied on every
# reboot. That is the entire safety argument, and it is why the timeout is 0
# (never expire): a reboot is the only event that changes a fact this repo
# reads. `kernel`, which fairydust's rebuild guard tests, flips at boot rather
# than when the role builds it; `distribution_major_version` needs a release
# upgrade; user_dir, architecture and processor_vcpus need different hardware.
# So the cache cannot outlive its own correctness.
#
# Do not move this somewhere persistent. A cache surviving a reboot is exactly
# how `./run.sh fairydust` would read a pre-reboot kernel and rebuild the
# kernel already running. If XDG_RUNTIME_DIR is unset — a bare `su -` — the
# path is unwritable and ansible runs uncached: slower, still correct.
gathering               = smart
fact_caching            = jsonfile
fact_caching_connection = ${XDG_RUNTIME_DIR}/asahi-setup/facts
fact_caching_timeout    = 0

[privilege_escalation]
become_method = sudo
