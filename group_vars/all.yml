---
# Everything tunable lives here. Roles should not hardcode paths or versions.

target_user: patte
src_dir: "/home/{{ target_user }}/src"

# --- base -------------------------------------------------------------------
base_packages:
  - dnf-plugins-core
  - btop
  - neovim
  - gh
  - yubikey-manager

# --- shell ------------------------------------------------------------------
# zsh itself is installed by the shell role, since that role owns the config.
login_shell: /usr/bin/zsh
# Pinned: .zshrc sources ~/.atuin/bin/env, which only the upstream cargo-dist
# installer produces. Fedora's atuin package installs to /usr/bin instead.
atuin_version: v18.18.1

# The prompt. Not packaged for Fedora, but upstream ships a static aarch64-musl
# binary per release. Bumping this version is the whole reinstall trigger, so
# unlike atuin above there is no `creates:` guard to delete first.
starship_version: v1.26.0

# --- copr -------------------------------------------------------------------
# The copr module derives the chroot from /etc/os-release ID, which on this box
# is `fedora-asahi-remix` — not a chroot any COPR actually builds for. Asahi
# Remix is Fedora as far as COPR is concerned, so name it explicitly. Any future
# COPR role should use this too.
copr_chroot: "fedora-{{ ansible_facts['distribution_major_version'] }}-{{ ansible_facts['architecture'] }}"

# --- hyprland ---------------------------------------------------------------
# Retired from Fedora, so it comes from a COPR. sdegler ships the whole hypr
# stack (its own aquamarine/hyprutils/hyprlang/hyprgraphics), which is why it
# works where Fedora's stale support libraries do not, and it had a
# fedora-44-aarch64 build of 0.56.1 the day upstream tagged it. Reuses
# copr_chroot above — Asahi Remix is plain Fedora as far as COPR is concerned.
hyprland_copr: sdegler/hyprland
hyprland_copr_baseurl: "https://download.copr.fedorainfracloud.org/results/{{ hyprland_copr }}/{{ copr_chroot }}/"
hyprland_copr_gpgkey: "https://download.copr.fedorainfracloud.org/results/{{ hyprland_copr }}/pubkey.gpg"

# The allowlist that keeps this repo from winning packages it should not. Note
# xdg-desktop-portal-hyprland does not match hypr*.
hyprland_copr_includepkgs:
  - hypr*
  - aquamarine
  - xdg-desktop-portal-hyprland

# From the COPR: things Fedora has no package for.
hyprland_copr_packages:
  - hyprland
  - xdg-desktop-portal-hyprland
  - hyprpolkitagent

# From Fedora: everything a bare compositor does not come with. Stock configs
# except the bar's, which cannot be — see the waybar tasks in the role.
#
# The last four are what the bar's click menus shell out to, and only one of them
# is a given on a Workstation install. bluez and libnotify come in with GNOME;
# pipewire-pulseaudio is the sound server, but `pactl` is not in it — that lives
# in pulseaudio-utils, which nothing here would otherwise pull.
hyprland_packages:
  - waybar
  - wofi
  - mako
  - grim
  - slurp
  - wl-clipboard
  - brightnessctl
  - playerctl
  - bluez
  - libnotify
  - pipewire-pulseaudio
  - pulseaudio-utils

# The one font the bar draws everything with, text and icons alike. Must be a
# Nerd-patched family — the icons are Font Awesome codepoints and a stock family
# has none of them — and must be in fonts_enabled below, or the role installs
# something the bar never asks for and asks for something nothing installed.
waybar_font_family: SFMono Nerd Font

# --- rust -------------------------------------------------------------------
rust_toolchain: stable

# --- ghostty ----------------------------------------------------------------
# The fontconfig family name; whichever family this is must be in fonts_enabled
# below. Set ghostty_font_style_bold to "" for any family that ships a real bold.
ghostty_font_family: SFMono Nerd Font
ghostty_font_style_bold: ""
ghostty_font_style_bold_italic: ""

# A second family ghostty consults only for codepoints the primary lacks.
#
# This exists for claude code's throbber, which pulses out and back through six
# frames:
#   U+273D ✽  U+273B ✻  U+2736 ✶  U+002A *  U+2722 ✢  U+00B7 ·
# The asterisk is not a typo: on ghostty and every non-Darwin terminal upstream
# substitutes plain `*` for the U+2733 ✳ it uses elsewhere, so this set is what
# a Linux ghostty actually receives. Nothing about it is configurable — the
# request to expose the frames was closed as not planned.
#
# No Nerd Font family above carries any of the four dingbats; Nerd-patching adds
# icons in the private use area and does not fill holes in the standard blocks.
# Left to fontconfig each frame resolves on its own and lands on a different
# font, so the throbber changes size and weight as it turns instead of pulsing.
#
# Adwaita Mono covers all six, is spacing=100, and is a Fedora package rather
# than a download — the fonts role installs it. It is also the only candidate
# that draws them on a common centre: Symbola and Noto Sans Symbols 2 cover the
# set too, but their ink centres wander 5-10 units per frame at a 200px em,
# which is the sideways lurch this is meant to avoid. Note this is the stock
# family, not `AdwaitaMono Nerd Font` — the primary already supplies the icons.
# Set to "" to emit no fallback at all.
ghostty_font_family_fallback: Adwaita Mono

# Frames the fallback must be forced to claim, because the primary *can* draw
# them and a fallback chain only fires where the primary comes up empty.
#
# SF Mono has two of the six — U+002A and U+00B7 — and the primary always wins
# where it has a glyph. So it takes those two and forfeits the four dingbats,
# which is what splits one animation across two families. Partial coverage is
# worse than none here: had SF Mono carried none of the six, all six would fall
# through to the fallback and agree with each other.
#
# U+00B7 goes to the fallback for that reason alone. U+002A is the interesting
# one, and it does NOT go to the fallback — it goes to a third family, because
# the visible defect here was never horizontal.
#
# `*` is an ASCII asterisk and every text font draws it as a raised mark, up
# near cap height, while the five dingbats are centred on the em. Measured off
# screenshots of a real window, each frame's ink centre against an `M` on the
# same line, in device px at 1.5x scale:
#
#   ✽ +0.80   ✻ +1.59   ✶ +1.65   ✢ +1.63   · +1.87
#   *         -2.40 from Adwaita Mono   <- 4.05 px, 2.7 logical px, HIGH
#   *         +1.29 from Source Code Pro Semibold
#
# At size 12 the glyph is ~11px tall, so a 2.7px hop is enormous — the throbber
# visibly bounces once per pulse. Vertical spread across the six frames goes
# from 2.85 to 0.63 logical px by moving this one codepoint. Every Source Code
# Pro weight centres its asterisk; Semibold is the pick because its 92 units
# match Adwaita's `*` exactly, so nothing changes size either. Verify with
# `ghostty +show-face --string='✽✻✶*✢·'` plus a look, since show-face cannot
# tell you about height.
#
# The cost: every other `*` in the terminal comes from Source Code Pro, and
# every `·` from Adwaita — markdown bold, globs, pointers, status separators.
# All are small marks at matched widths, so the shift is slight, but it is not
# confined to the throbber.
#
# What no mapping fixes: the frames are near-flat in size (90 88 90 92 98) and
# then collapse to 32, so the pulse is a stutter-and-drop rather than a ramp.
# Every font that actually has ✢ draws it largest — Adwaita 98, OpenSymbol 113,
# Symbola 144, Noto Sans Symbols 2 155 — and it needs to be smaller than ✶ at
# 90 for the pulse to descend. Empty for no mappings.
ghostty_font_codepoint_map:
  - U+002A=Source Code Pro Semibold
  - U+00B7=Adwaita Mono

# --- keyswaps ---------------------------------------------------------------
keyd_repo: https://github.com/rvaiya/keyd.git
keyd_version: v2.6.0

# --- titdb ------------------------------------------------------------------
titdb_repo: https://github.com/tascvh/trackpad-is-too-damn-big.git
titdb_commit: 26fcd89a8e9620be11783c34aedeff12968ae600
# The Apple MTP touchpad. by-path, because evdev numbering moves across boots.
titdb_device: /dev/input/by-path/platform-24eb30000.input-event-mouse

# --- fairydust --------------------------------------------------------------
# Matched against the running kernel to decide whether a build is needed.
fairydust_localversion: "-asahi-fairydust"

# --- fonts ------------------------------------------------------------------
# Down here because it is the longest section and nothing else refers to it —
# only the fonts role reads these. The family names ghostty wants are in the
# ghostty section above.

# Which families a run installs. The role knows how to fetch all four below;
# only the ones listed here are downloaded. This is install-time selection
# only — nothing is ever removed, so a family dropped from the list stays on
# disk and keeps working until you delete it by hand.
#
# Directory here, ghostty_font_family name on the right:
#
#   DMMonoNerdFont         DMMono Nerd Font         no bold face — needs the
#                                                   ghostty style override
#   JetBrainsMonoNerdFont  JetBrainsMono Nerd Font  real bold
#   SFMonoNerdFont         SFMono Nerd Font         real bold and italic
#   Tabular                Tabular                  real bold, but not
#                                                   Nerd-patched, so no icons
fonts_enabled:
  - SFMonoNerdFont

fonts_dir: "/home/{{ target_user }}/.local/share/fonts"

# DM Mono run through the Nerd Fonts patcher. Upstream publishes no releases
# and no tags, so pin the commit and take the tarball GitHub generates for it.
# Note the family name fontconfig reports has no space: `DMMono Nerd Font`.
dm_mono_commit: 6673b66d809c93e3fd08051edf92710f4e67170f
dm_mono_url: "https://github.com/minhuw/dm-mono-nerd-font/archive/{{ dm_mono_commit }}.tar.gz"

# Apple's SF Mono, run through the Nerd Fonts patcher. Same story as DM Mono:
# no releases worth pulling, so pin the commit and take the tarball. Twelve
# OTFs at the repo root, and unlike DM Mono it has a real Bold and Italic.
sf_mono_commit: ebd4255167f1b9105cfdf5694ea9a474f08a51c3
sf_mono_url: "https://github.com/epk/SF-Mono-Nerd-Font/archive/{{ sf_mono_commit }}.tar.gz"

# Nerd Fonts ships one zip per family, flat at the root: every weight in all
# three widths (default, Mono, Propo). Ghostty embeds its own copy of plain
# JetBrains Mono, so this is for everything that is not ghostty.
nerd_fonts_version: v3.4.0
jetbrains_mono_url: "https://github.com/ryanoasis/nerd-fonts/releases/download/{{ nerd_fonts_version }}/JetBrainsMono.zip"

# Fontshare has no versioned URL — this always serves whatever is current, so
# there is nothing to pin. The `creates:` guard means an existing install is
# never re-fetched; delete the directory to pick up a newer cut.
tabular_url: https://api.fontshare.com/v2/fonts/download/tabular
