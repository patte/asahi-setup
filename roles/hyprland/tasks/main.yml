---
# Hyprland is not installable from Fedora: it was retired on 2026-09-30 by the
# fails-to-install automation, and the hypr* support libraries Fedora still
# ships are several major versions behind what a current Hyprland needs.
# Building it from source would mean seven CMake projects into a prefix
# shadowing Fedora's, redone on every release — this is the one place in here
# where a COPR beats building it ourselves.
#
# 0.51 is the hard floor on this hardware: that is the release that fixed
# explicit sync against Asahi's split-node GPU driver. Do not point this at
# solopasha/hyprland, which is stale at exactly 0.51.
- name: Import the hyprland COPR signing key
  become: true
  ansible.builtin.rpm_key:
    key: "{{ hyprland_copr_gpgkey }}"
    state: present

# Deliberately not community.general.copr, unlike the ghostty role. This COPR
# also ships kitty, waybar, qt6ct, uwsm, cliphist and swww, which Fedora ships
# too, and no repo priority is set — so highest version wins and a later
# `dnf install waybar` would quietly pull the COPR build. yum_repository can
# express includepkgs; the copr module cannot.
- name: Add the hyprland COPR, scoped to the hypr stack
  become: true
  ansible.builtin.yum_repository:
    name: copr-hyprland
    description: "COPR {{ hyprland_copr }} (scoped to the hypr stack)"
    baseurl: "{{ hyprland_copr_baseurl }}"
    gpgkey: "{{ hyprland_copr_gpgkey }}"
    gpgcheck: true
    includepkgs: "{{ hyprland_copr_includepkgs }}"
    enabled: true

# The COPR half is the compositor and the pieces Fedora has no package for at
# all; the rest comes from Fedora and is excluded from the COPR above.
#
# Weak deps are left on: hyprland Recommends mesa-dri-drivers, polkit and the
# qt6-qtwayland-if-qt6 pair, which are all wanted. Two consequences worth
# knowing — Fedora's kitty rides along (recommended, and the COPR's own kitty is
# blocked by includepkgs), and hyprland-uwsm is dropped as unsatisfiable, since
# it needs uwsm, which Fedora does not package and includepkgs blocks here. So
# GDM gets one Hyprland entry, not two.
- name: Install the hyprland stack
  become: true
  ansible.builtin.dnf5:
    name: "{{ hyprland_copr_packages + hyprland_packages }}"
    state: present

- name: Ensure the hypr config directory exists
  tags: [hyprland-config]
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/hypr"
    state: directory
    mode: "0755"

# Hyprland 0.5x looks for ~/.config/hypr/hyprland.lua first and only falls back
# to the old hyprlang hyprland.conf when no .lua exists. New config, so it is
# the lua one — do not add a hyprland.conf next to it, it would be dead weight.
#
# This task and the directory above carry the extra `hyprland-config` tag: they
# are the whole of what ./hypr.sh runs, which is the edit loop for the config.
# Anything added here that is not pure config must stay untagged.
- name: Install the hyprland config
  tags: [hyprland-config]
  ansible.builtin.copy:
    src: hyprland.lua
    dest: "{{ ansible_facts['user_dir'] }}/.config/hypr/hyprland.lua"
    mode: "0644"

# The bar is the one stock config we replace outright, because under Hyprland
# half of it does not run: /etc/xdg/waybar/config.jsonc names `sway/workspaces`
# and `sway/window`. See the header of our copy for what else differs.
#
# Only the config, not the stylesheet. narchy owns ~/.config/waybar/style.css —
# it seeds it from /etc/xdg on `narchy link` and appends its palette import — and
# both halves address modules by the same ids, so the two never meet.
- name: Ensure the waybar config directory exists
  tags: [hyprland-config]
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/waybar/scripts"
    state: directory
    mode: "0755"

- name: Install the waybar config
  tags: [hyprland-config]
  ansible.builtin.copy:
    src: waybar/config.jsonc
    dest: "{{ ansible_facts['user_dir'] }}/.config/waybar/config.jsonc"
    mode: "0644"
  notify: Reload waybar

# The click targets for the volume and bluetooth modules. Executable, and no
# reload needed: waybar shells out to them fresh on every click.
- name: Install the waybar menu scripts
  tags: [hyprland-config]
  ansible.builtin.copy:
    src: "waybar/scripts/{{ item }}"
    dest: "{{ ansible_facts['user_dir'] }}/.config/waybar/scripts/{{ item }}"
    mode: "0755"
  loop:
    - audio-output
    - bluetooth

# The stylesheet is shared with narchy, so it is assembled rather than owned:
# seeded once from the stock one for waybar's own layout rules, then imported
# into. narchy does the same thing from the other side — it prepends a palette
# import and appends a theme import, both idempotently — and the two only
# coexist because neither rewrites the file.
#
# force: false is the whole of that promise. Never turn it into a plain copy: it
# would drop narchy's import lines on every run and leave the bar unthemed until
# the next `narchy link`.
- name: Seed the waybar stylesheet from the stock one
  tags: [hyprland-config]
  ansible.builtin.copy:
    src: /etc/xdg/waybar/style.css
    remote_src: true
    dest: "{{ ansible_facts['user_dir'] }}/.config/waybar/style.css"
    force: false
    mode: "0644"

- name: Install the waybar metrics stylesheet
  tags: [hyprland-config]
  ansible.builtin.template:
    src: waybar/metrics.css.j2
    dest: "{{ ansible_facts['user_dir'] }}/.config/waybar/metrics.css"
    mode: "0644"
  notify: Reload waybar

# Last, so it wins the properties it sets — though it sets none that narchy's
# imports also do, which is the point of keeping colour out of it.
- name: Import the metrics stylesheet from the waybar stylesheet
  tags: [hyprland-config]
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['user_dir'] }}/.config/waybar/style.css"
    line: '@import "{{ ansible_facts["user_dir"] }}/.config/waybar/metrics.css";'
    state: present
  notify: Reload waybar

# Nothing to enable or start: the package drops hyprland.desktop into
# /usr/share/wayland-sessions/, so the session shows up at the GDM gear icon
# next to GNOME. GDM remembers the last choice per user, so GNOME stays the
# default until it is picked deliberately.
