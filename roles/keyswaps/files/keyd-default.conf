# keyd config — source of truth, install to /etc/keyd/default.conf
# See README.md in this folder.

[ids]
*

[main]

# Caps Lock key acts as Ctrl. Done here rather than in xkb so that the
# capslock keycode stays available for the Super+CapsLock escape hatch below.
capslock = layer(control)

[meta]

# Mac-style copy/paste. These are the XF86 media keysyms, NOT Ctrl+C/V/X —
# sending Ctrl+C here would SIGINT in a terminal instead of copying.
c = copy
v = paste
x = cut

# Escape hatch: the only way to toggle real Caps Lock. Press Super first.
capslock = capslock
