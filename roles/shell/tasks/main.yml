---
- name: Install zsh
  become: true
  ansible.builtin.dnf5:
    name: zsh
    state: present

- name: Make zsh the login shell
  become: true
  ansible.builtin.user:
    name: "{{ target_user }}"
    shell: "{{ login_shell }}"

# .zshrc sources ~/.atuin/bin/env unconditionally, so atuin has to exist before
# the first login or every new shell errors. Fedora packages atuin, but under
# /usr/bin — this uses the upstream cargo-dist installer to reproduce the
# ~/.atuin/bin layout the shell config actually expects.
- name: Install atuin {{ atuin_version }}
  ansible.builtin.shell:
    cmd: >-
      curl --proto '=https' --tlsv1.2 -LsSf
      https://github.com/atuinsh/atuin/releases/download/{{ atuin_version }}/atuin-installer.sh
      | sh
    creates: "{{ ansible_facts['user_dir'] }}/.atuin/bin/atuin"

- name: Ensure the atuin config directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/atuin"
    state: directory
    mode: "0755"

- name: Install the atuin config
  ansible.builtin.copy:
    src: atuin-config.toml
    dest: "{{ ansible_facts['user_dir'] }}/.config/atuin/config.toml"
    mode: "0600"

# .zshrc runs `starship init zsh`, so like atuin the binary has to exist before
# the first login. Fedora does not package starship, and upstream publishes a
# static aarch64-musl binary per release, so take that — a cargo build would
# put the shell role behind the rust one for no gain.
- name: Ensure ~/.local/bin exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.local/bin"
    state: directory
    mode: "0755"

# The version in the tarball name is the whole install guard: no `creates:`,
# because that would ignore a version bump in group_vars. Skipped in check
# mode, where the install below then always reports a change.
- name: Check the installed starship
  ansible.builtin.command: "{{ ansible_facts['user_dir'] }}/.local/bin/starship --version"
  register: starship_current
  changed_when: false
  failed_when: false

- name: Install starship {{ starship_version }}
  ansible.builtin.unarchive:
    src: >-
      https://github.com/starship/starship/releases/download/{{ starship_version }}/starship-{{ ansible_facts['architecture'] }}-unknown-linux-musl.tar.gz
    dest: "{{ ansible_facts['user_dir'] }}/.local/bin"
    remote_src: true
    # The tarball ships the binary 0644.
    mode: "0755"
  when: starship_version | regex_replace('^v', '') not in starship_current.stdout | default('')

- name: Install the starship config
  ansible.builtin.copy:
    src: starship.toml
    dest: "{{ ansible_facts['user_dir'] }}/.config/starship.toml"
    mode: "0644"

- name: Install .zshrc
  ansible.builtin.copy:
    src: zshrc
    dest: "{{ ansible_facts['user_dir'] }}/.zshrc"
    mode: "0644"

# Sources ~/.cargo/env — see the rust role.
- name: Install .zshenv
  ansible.builtin.copy:
    src: zshenv
    dest: "{{ ansible_facts['user_dir'] }}/.zshenv"
    mode: "0644"

- name: Ensure ~/.ssh exists for the agent-socket symlink in .zshrc
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.ssh"
    state: directory
    mode: "0700"
