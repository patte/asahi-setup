---
- name: Enable the ghostty COPR
  become: true
  community.general.copr:
    name: scottames/ghostty
    chroot: "{{ copr_chroot }}"
    state: enabled

- name: Install ghostty
  become: true
  ansible.builtin.dnf5:
    name: ghostty
    state: present

- name: Ensure the ghostty config directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/ghostty"
    state: directory
    mode: "0755"

# theme = Ayu in here is ghostty's built-in, so no theme files are shipped.
# Note ghostty loads every file in ~/.config/ghostty, not just `config` — which
# is what lets this file and narchy's generated one coexist.
- name: Install the ghostty config
  ansible.builtin.template:
    src: config.ghostty.j2
    dest: "{{ ansible_facts['user_dir'] }}/.config/ghostty/config.ghostty"
    mode: "0644"
