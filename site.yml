---
- name: Fedora Asahi Remix workstation
  hosts: local
  gather_facts: true

  roles:
    - role: base
      tags: [base]

    - role: shell
      tags: [shell]

    - role: rust
      tags: [rust]

    # Before ghostty: its config names DM Mono, which this role installs.
    - role: fonts
      tags: [fonts]

    - role: ghostty
      tags: [ghostty]

    - role: claude
      tags: [claude]

    - role: vscode
      tags: [vscode]

    - role: tailscale
      tags: [tailscale]

    - role: keyswaps
      tags: [keyswaps]

    - role: titdb
      tags: [titdb]

    # Additive and reversible: it adds a session next to GNOME and changes
    # nothing about the GNOME one, so it needs no `never` guard.
    - role: hyprland
      tags: [hyprland]

    # Tagged `never`: a full kernel compile is not something a routine run
    # should ever trigger. Only `./run.sh fairydust` reaches it.
    - role: fairydust
      tags: [fairydust, never]
