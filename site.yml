---
- name: Fedora Asahi Remix workstation
  hosts: local
  gather_facts: true

  roles:
    - role: base
      tags: [base]

    # After base, which is where vlc comes from: this is the role that makes it
    # able to play a 4K H.264 file rather than stutter through one.
    - role: codecs
      tags: [codecs]

    - role: shell
      tags: [shell]

    - role: rust
      tags: [rust]

    # Before ghostty: its config names ghostty_font_family and
    # ghostty_font_family_fallback, and this role is what installs them. Named
    # by variable rather than by family so swapping fonts cannot stale it.
    - role: fonts
      tags: [fonts]

    - role: ghostty
      tags: [ghostty]

    - role: claude
      tags: [claude]

    - role: vscode
      tags: [vscode]

    - role: tailscale
      tags: [tailscale]

    - role: keyswaps
      tags: [keyswaps]

    - role: titdb
      tags: [titdb]

    # After hyprland would be tidier on paper, since the wrapper's scaling is
    # the other half of that role's force_zero_scaling. It sits here because
    # nothing in it reads hyprland's config — steam_ui_scale is the shared
    # value, and it lives in group_vars where both can see it.
    - role: steam
      tags: [steam]

    # Additive and reversible: it adds a session next to GNOME and changes
    # nothing about the GNOME one, so it needs no `never` guard.
    - role: hyprland
      tags: [hyprland]

    # Last of the real roles, because `narchy link` writes a line into the config
    # of every app it finds and those configs have to exist first — waybar's
    # stylesheet and hyprpaper come from hyprland above, ghostty and vscode from
    # their own roles, btop and neovim and vlc from base. It also links only what
    # is installed, so a role that has not run yet is an app silently skipped.
    - role: narchy
      tags: [narchy]

    # Tagged `never`: a full kernel compile is not something a routine run
    # should ever trigger. Only `./run.sh fairydust` reaches it.
    - role: fairydust
      tags: [fairydust, never]
