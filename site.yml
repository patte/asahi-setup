---
- name: Fedora Asahi Remix workstation
  hosts: local
  gather_facts: true

  roles:
    # First, and that is the whole point of where it sits: it decides which repo
    # supplies mesa, and every later role that installs anything can pull mesa
    # in as a weak dependency. Getting Fedora's build is a one-way door — the
    # sticky-vendor config will not migrate it back — so the priority has to be
    # right before anything else runs dnf.
    - role: mesa
      tags: [mesa]

    - role: base
      tags: [base]

    # After base, which is where vlc comes from: this is the role that makes it
    # able to play a 4K H.264 file rather than stutter through one.
    - role: codecs
      tags: [codecs]

    - role: shell
      tags: [shell]

    - role: rust
      tags: [rust]

    # Before ghostty: its config names ghostty_font_family and
    # ghostty_font_family_fallback, and this role is what installs them. Named
    # by variable rather than by family so swapping fonts cannot stale it.
    - role: fonts
      tags: [fonts]

    - role: ghostty
      tags: [ghostty]

    - role: claude
      tags: [claude]

    - role: vscode
      tags: [vscode]

    - role: tailscale
      tags: [tailscale]

    - role: keyswaps
      tags: [keyswaps]

    - role: titdb
      tags: [titdb]

    # Additive and reversible: it adds a session next to GNOME and changes
    # nothing about the GNOME one, so it needs no `never` guard.
    - role: hyprland
      tags: [hyprland]

    # Tagged `never`: a full kernel compile is not something a routine run
    # should ever trigger. Only `./run.sh fairydust` reaches it.
    - role: fairydust
      tags: [fairydust, never]
